<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
        <script>
  (function () {
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark') document.documentElement.classList.add('dark-mode');
    } catch (e) {}
  })();
</script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&family=Inter:wght@400&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1 class="title">Projects</h1>

        <button class="hamburger" id="hamburger" aria-label="Toggle navigation menu">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </button>


        <nav class="navbar" id="navbar" aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="educationAndExperience.html">Education and Experience</a></li>
            </ul>
        </nav>
    </header>

    <main class="page-content">
        <section class="section-card reveal">
            <h2>GitHub Portfolio:</h2>

           <div class="repo-controls" aria-label="Repository filters">
            <div class="repo-controls-row">
                <label class="repo-control">
                <span>Search</span>
                <input id="repoSearch" type="search" placeholder="Search by name or description…" />
                </label>

                <label class="repo-control">
                <span>Language</span>
                <select id="repoLanguage">
                    <option value="all">All</option>
                </select>
                </label>

                <label class="repo-control">
                <span>Sort</span>
                <select id="repoSort">
                    <option value="updated">Last updated</option>
                    <option value="stars">Stars</option>
                    <option value="name">Name (A–Z)</option>
                </select>
                </label>

                <button id="repoReset" class="btn" type="button">Reset</button>
            </div>
            </div>

            <div id="repoStatus" class="repo-status">
                <span class="spinner" aria-hidden="true"></span>
                <span id="repoStatusText">Loading projects…</span>
            </div>

            <div id="repoGrid" class="repo-grid" aria-live="polite"></div>
            <div class="repo-loadmore">
            <button id="loadMoreBtn" class="btn" type="button">Load more</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Maria's Portfolio. All rights reserved.</p>
        <p>

            <a href="https://www.linkedin.com/in/maria-popa-770931398/">LinkedIn</a>
        </p>
    </footer>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle Theme">🌙</button>
    <script src="script.js"></script>
</body>
</html>
